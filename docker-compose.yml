services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: efcore-dba-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LabPassword!2026"
      MSSQL_PID: "Developer"
    ports:
      - "14333:1433"
    volumes:
      - efcore-dba-sql-data:/var/opt/mssql
    healthcheck:
      # TCP probe — does not depend on sqlcmd being present in the image.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/1433'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

volumes:
  efcore-dba-sql-data:
