 <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#4b5563"/></marker></defs>
 
<rect x="40" y="45" width="1520" height="235" rx="30" fill="#ffe6e8"/><text x="160" y="190" font-size="100" font-weight="800" fill="#c91420">BAD</text><text x="930" y="185" font-size="64" font-weight="700" text-anchor="middle">= too much in one query</text>
<rect x="40" y="330" width="1520" height="235" rx="30" fill="#fff4d6"/><text x="160" y="475" font-size="100" font-weight="800" fill="#e59600">N+1</text><text x="900" y="470" font-size="64" font-weight="700" text-anchor="middle">= too many queries</text>
<rect x="40" y="615" width="1520" height="235" rx="30" fill="#e6f7e8"/><text x="150" y="760" font-size="100" font-weight="800" fill="#087a25">GOOD</text><text x="1020" y="735" font-size="56" font-weight="700" text-anchor="middle">= workload shaped to</text><text x="1020" y="800" font-size="56" font-weight="700" text-anchor="middle">the actual need</text>
 </svg>